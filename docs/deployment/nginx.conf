# Include from the nginx http context (sites-enabled on Ubuntu).
# Replace verity.example.com everywhere, including certificate paths.
# These starting limits are per client IP; tune for shared corporate networks.
limit_req_zone $binary_remote_addr zone=verity_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=verity_agent:10m rate=30r/m;

server {
    listen 80;
    server_name verity.example.com;
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://verity.example.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name verity.example.com;
    ssl_certificate /etc/letsencrypt/live/verity.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/verity.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;
    limit_req_status 429;

    root /var/www/verity;
    index index.html;

    # Applied to all API/admin locations below. Gunicorn binds only to loopback.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;

    location ~ ^/api/v1/auth/(login|register|setup)/$ {
        limit_req zone=verity_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }
    location /api/v1/agent/ {
        limit_req zone=verity_agent burst=10 nodelay;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:8000;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
    }
    location /admin/ {
        limit_req zone=verity_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }
    location /static/ {
        alias /var/www/verity-static/;
    }
    location /assets/ {
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
